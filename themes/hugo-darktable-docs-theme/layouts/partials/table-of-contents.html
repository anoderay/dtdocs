{{- /* Collapsible "On this page" below the title, used where the right-hand column is hidden. */ -}}
{{- $toc := .TableOfContents -}}
{{- if ge (len (findRE "<li" $toc)) 2 }}
<details class="dt-toc-inline d-xl-none">
    <summary>{{ i18n "table-of-contents" | default "Table of Contents" }}</summary>
    {{ $toc | replaceRE `id="TableOfContents"` "" | safeHTML }}
</details>
{{- end }}

{{- /* "On this page" for wide screens. Only shown when the page has at least two headings. */ -}}
{{- $toc := .TableOfContents -}}
{{- if ge (len (findRE "<li" $toc)) 2 }}
<div class="dt-toc__inner">
    {{- /* the title leads back to the top of the page */}}
    <a class="dt-toc__title" href="#" title="{{ i18n "back-to-top" | default "Back to top" }}">{{ i18n "table-of-contents" | default "Table of Contents" }}</a>
    {{ $toc }}
</div>
{{- end }}

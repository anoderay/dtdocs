baseURL:  https://docs.darktable.org/usermanual/development/
defaultContentLanguage: en
defaultContentLanguageInSubdir: true
languages:
  en:
    title: darktable user manual
    languageName: English
  fr:
    title: darktable user manual
    languageName: Français
  de:
    title: darktable user manual
    languageName: German
  eo:
    title: darktable user manual
    languageName: Esperanto
  es:
    title: darktable user manual
    languageName: Español
  gl:
    title: darktable user manual
    languageName: Galician
  it:
    title: darktable user manual
    languageName: Italian
  pl:
    title: darktable user manual
    languageName: Polish
  pt_br:
    title: manual do usuário darktable
    languageName: Português
  uk:
    title: darktable user manual
    languageName: Ukrainian
  nl:
    title: darktable user manual
    languageName: Dutch
  lo:
    title: darktable user manual
    languageName: Lao
theme:
  - hugo-darktable-docs-theme
markup:
  highlight:
    style: algol_nu
  tableOfContents:
    endLevel: 3
    ordered: false
    startLevel: 1
outputs:
  home:
    - HTML
    - RSS
    - JSON
module:
  mounts:
    - source: ./themes//hugo-darktable-docs-theme/assets/node_modules/fork-awesome/fonts
      target: static/fonts
    - source: static/darktable.svg
      target: assets/images/darktable.svg
params:
  # Base URL for the "edit this page" link (English source files only).
  editURL: https://github.com/darktable-org/dtdocs/edit/master/content/
  # Optional: link shown on translated pages instead of the edit link.
  # "%s" is replaced by the language code, e.g.
  # weblateURL: https://hosted.weblate.org/projects/<project>/<component>/%s/
ignoreFiles:
- \.svg$
- \.odg$
- \.xcf$
